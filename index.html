<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch Woordtrainer</title>
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --text: #1c1c1e; --muted: #6b6b70;
    --line: #e4e1da; --accent: #d4a017; --accent-ink: #1c1c1e;
    --good: #2e9e5b; --good-bg: #e3f5ea; --bad: #d1433f; --bad-bg: #fbe7e6;
    --der: #2f6fd6; --die: #d1433f; --das: #2e9e5b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --card: #1f1f23; --text: #f2f2f4; --muted: #9a9aa2;
      --line: #2e2e34; --accent: #e5b42a; --accent-ink: #141416;
      --good: #4cc27c; --good-bg: #183324; --bad: #f06a66; --bad-bg: #3a1c1b;
      --der: #6ea0ff; --die: #ff7b77; --das: #5fd18f;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100dvh; padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px); }
  .wrap { max-width: 520px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 8px; }
  .flag { display: inline-flex; flex-direction: column; width: 26px; height: 18px; border-radius: 3px; overflow: hidden; margin-right: 10px; vertical-align: middle; }
  .flag i { flex: 1; } .flag i:nth-child(1){background:#000} .flag i:nth-child(2){background:#dd0000} .flag i:nth-child(3){background:#ffce00}
  h1 { font-size: 20px; margin: 0; display: flex; align-items: center; }
  .pill { font-size: 13px; color: var(--muted); background: var(--card); border: 1px solid var(--line); padding: 6px 10px; border-radius: 999px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin: 12px 0; }
  .label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg); border-radius: 12px; padding: 4px; gap: 4px; }
  .seg button { border: 0; background: transparent; color: var(--text); padding: 10px 4px; border-radius: 9px; font-size: 14px; font-weight: 600; }
  .seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .cats { display: grid; gap: 8px; }
  .cat { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 14px; padding: 12px; font-size: 16px; }
  .cat.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .cat .ic { font-size: 22px; width: 30px; text-align: center; }
  .cat .nm { flex: 1; font-weight: 600; }
  .cat .sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 4px; }
  .bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; background: var(--good); }
  .check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; }
  .cat.on .check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .big { width: 100%; border: 0; border-radius: 14px; padding: 16px; font-size: 17px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
  .ghost { width: 100%; border: 1px solid var(--line); border-radius: 14px; padding: 14px; font-size: 15px; font-weight: 600; background: transparent; color: var(--text); margin-top: 8px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .stats b { display: block; font-size: 22px; }
  .stats span { font-size: 12px; color: var(--muted); }

  /* Quiz */
  .top { display: flex; align-items: center; gap: 10px; padding: 14px 0 6px; }
  .x { border: 0; background: var(--card); color: var(--text); width: 38px; height: 38px; border-radius: 50%; font-size: 18px; border: 1px solid var(--line); }
  .prog { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .q { text-align: center; padding: 28px 16px; }
  .q .cat-tag { font-size: 12px; color: var(--muted); }
  .q .word { font-size: 30px; font-weight: 800; line-height: 1.25; margin: 10px 0 6px; word-break: break-word; }
  .q .word.long { font-size: 23px; }
  .q .hint { font-size: 14px; color: var(--muted); }
  .speak { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 999px; padding: 6px 14px; font-size: 14px; margin-top: 10px; }
  .art-der { color: var(--der); } .art-die { color: var(--die); } .art-das { color: var(--das); }
  .opts { display: grid; gap: 10px; }
  .opt { width: 100%; text-align: left; border: 2px solid var(--line); background: var(--card); color: var(--text); border-radius: 14px; padding: 15px 16px; font-size: 17px; font-weight: 500; min-height: 56px; transition: transform .08s; }
  .opt:active { transform: scale(.98); }
  .opt.good { border-color: var(--good); background: var(--good-bg); }
  .opt.bad { border-color: var(--bad); background: var(--bad-bg); }
  .opt.dim { opacity: .5; }
  .fb { margin-top: 12px; border-radius: 14px; padding: 14px; font-size: 15px; display: none; }
  .fb.show { display: block; }
  .fb.good { background: var(--good-bg); color: var(--text); }
  .fb.bad { background: var(--bad-bg); color: var(--text); }
  .fb .tip { margin-top: 6px; color: var(--muted); font-size: 14px; }
  .next { margin-top: 12px; display: none; }
  .next.show { display: block; }

  /* Result */
  .score { text-align: center; padding: 24px 10px 8px; }
  .score .num { font-size: 52px; font-weight: 800; }
  .mist { list-style: none; padding: 0; margin: 0; }
  .mist li { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .mist li:last-child { border-bottom: 0; }
  .mist .de { font-weight: 700; }
  .mist .nl { color: var(--muted); font-size: 14px; }
  .hidden { display: none !important; }
  .foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 18px; }
  .foot button { border: 0; background: none; color: var(--muted); text-decoration: underline; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- HOME -->
  <section id="home">
    <header>
      <h1><span class="flag"><i></i><i></i><i></i></span>Deutsch A1</h1>
      <span class="pill" id="streak">🔥 0 dagen</span>
    </header>

    <div class="card">
      <div class="stats">
        <div><b id="sKnown">0</b><span>beheerst</span></div>
        <div><b id="sSeen">0</b><span>geoefend</span></div>
        <div><b id="sTotal">0</b><span>totaal</span></div>
      </div>
    </div>

    <div class="card">
      <p class="label">Richting</p>
      <div class="seg" id="dirSeg">
        <button data-dir="de">🇩🇪 → 🇳🇱</button>
        <button data-dir="nl">🇳🇱 → 🇩🇪</button>
        <button data-dir="mix">Mix</button>
      </div>
      <p class="label" style="margin-top:16px">Lengte ronde</p>
      <div class="seg" id="lenSeg">
        <button data-len="10">10</button>
        <button data-len="20">20</button>
        <button data-len="30">30</button>
      </div>
    </div>

    <p class="label" style="margin:18px 4px 8px">Onderwerpen</p>
    <div class="cats" id="cats"></div>

    <div style="margin-top:16px">
      <button class="big" id="startBtn">Start oefenen</button>
      <button class="ghost" id="weakBtn">Oefen mijn lastige woorden</button>
    </div>

    <div class="foot">Voortgang wordt op dit toestel bewaard · <button id="resetBtn">reset</button></div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="top">
      <button class="x" id="quitBtn" aria-label="Stoppen">✕</button>
      <div class="prog"><i id="progBar" style="width:0%"></i></div>
      <span class="pill" id="progTxt">1/10</span>
    </div>
    <div class="card q">
      <div class="cat-tag" id="qCat"></div>
      <div class="word" id="qWord"></div>
      <div class="hint" id="qHint"></div>
      <button class="speak" id="speakBtn">🔊 Uitspraak</button>
    </div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <button class="big next" id="nextBtn">Volgende</button>
  </section>

  <!-- RESULT -->
  <section id="result" class="hidden">
    <div class="score">
      <div id="rEmoji" style="font-size:44px"></div>
      <div class="num" id="rScore"></div>
      <div class="hint" id="rText" style="color:var(--muted)"></div>
    </div>
    <div class="card" id="rMistCard">
      <p class="label">Nog even oefenen</p>
      <ul class="mist" id="rMist"></ul>
    </div>
    <button class="big" id="againBtn">Nog een ronde</button>
    <button class="ghost" id="homeBtn">Terug naar menu</button>
  </section>

</div>

<script src="words.js"></script>
<script>
(() => {
  // ---------- Opslag ----------
  const KEY = "deutsch-trainer-v1";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const state = Object.assign({ dir: "de", len: 10, cats: Object.keys(CATEGORIES), progress: {}, days: [] }, load());
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

  // ---------- Data ----------
  const items = WORDS.map(([cat, de, nl, tip]) => ({ id: cat + "|" + de, cat, de, nl, tip }));
  const alts = s => s.toLowerCase().replace(/\(.*?\)/g, "").split("/").map(x => x.replace(/^(de|het|der|die|das)\s+/, "").replace(/[!?.,]/g, "").trim()).filter(Boolean);
  const overlaps = (a, b) => { const A = alts(a); return alts(b).some(x => A.includes(x)); };
  const box = it => (state.progress[it.id]?.box) ?? -1;   // -1 = nieuw, 0..5 = Leitner-bak
  const MASTERED = 3;

  // ---------- Helpers ----------
  const $ = id => document.getElementById(id);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const colorArticle = s => esc(s).replace(/^(der|die|das)\b/, m => `<span class="art-${m}">${m}</span>`);
  const show = id => ["home", "quiz", "result"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  const today = () => new Date().toISOString().slice(0, 10);

  function streak() {
    const set = new Set(state.days); let n = 0; const d = new Date();
    if (!set.has(today())) d.setDate(d.getDate() - 1);
    while (set.has(d.toISOString().slice(0, 10))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  // ---------- Home ----------
  function renderHome() {
    $("sTotal").textContent = items.length;
    $("sSeen").textContent = items.filter(i => box(i) >= 0).length;
    $("sKnown").textContent = items.filter(i => box(i) >= MASTERED).length;
    const s = streak(); $("streak").textContent = `🔥 ${s} ${s === 1 ? "dag" : "dagen"}`;
    document.querySelectorAll("#dirSeg button").forEach(b => b.classList.toggle("on", b.dataset.dir === state.dir));
    document.querySelectorAll("#lenSeg button").forEach(b => b.classList.toggle("on", +b.dataset.len === state.len));
    const wrap = $("cats"); wrap.innerHTML = "";
    for (const [key, c] of Object.entries(CATEGORIES)) {
      const list = items.filter(i => i.cat === key);
      const known = list.filter(i => box(i) >= MASTERED).length;
      const on = state.cats.includes(key);
      const btn = document.createElement("button");
      btn.className = "cat" + (on ? " on" : "");
      btn.innerHTML = `<span class="ic">${c.icon}</span>
        <span class="nm">${c.name}<div class="sub">${known} / ${list.length} beheerst</div>
        <div class="bar"><i style="width:${(known / list.length) * 100}%"></i></div></span>
        <span class="check">${on ? "✓" : ""}</span>`;
      btn.onclick = () => {
        state.cats = on ? state.cats.filter(k => k !== key) : [...state.cats, key];
        save(); renderHome();
      };
      wrap.appendChild(btn);
    }
    $("startBtn").disabled = state.cats.length === 0;
    $("startBtn").style.opacity = state.cats.length ? 1 : .5;
    const weak = items.filter(i => { const p = state.progress[i.id]; return p && p.wrong > 0 && p.box < MASTERED; }).length;
    $("weakBtn").textContent = weak ? `Oefen mijn lastige woorden (${weak})` : "Oefen mijn lastige woorden";
    $("weakBtn").disabled = !weak; $("weakBtn").style.opacity = weak ? 1 : .5;
  }

  $("dirSeg").onclick = e => { const b = e.target.closest("button"); if (b) { state.dir = b.dataset.dir; save(); renderHome(); } };
  $("lenSeg").onclick = e => { const b = e.target.closest("button"); if (b) { state.len = +b.dataset.len; save(); renderHome(); } };
  $("resetBtn").onclick = () => { if (confirm("Alle voortgang wissen?")) { state.progress = {}; state.days = []; save(); renderHome(); } };

  // ---------- Selectie (slim herhalen) ----------
  function pick(pool, n) {
    // gewicht: nieuw & fout = vaker, beheerst = minder vaak
    const w = it => { const b = box(it); return b < 0 ? 4 : [8, 6, 4, 2, 1, 0.5][b] ?? 0.5; };
    const chosen = [], rest = [...pool];
    while (chosen.length < n && rest.length) {
      const total = rest.reduce((s, it) => s + w(it), 0);
      let r = Math.random() * total, i = 0;
      for (; i < rest.length; i++) { r -= w(rest[i]); if (r <= 0) break; }
      chosen.push(rest.splice(Math.min(i, rest.length - 1), 1)[0]);
    }
    return chosen;
  }

  // ---------- Quiz ----------
  let round = [], idx = 0, correct = 0, mistakes = [], answered = false, current = null;

  function start(weakOnly) {
    let pool = weakOnly
      ? items.filter(i => { const p = state.progress[i.id]; return p && p.wrong > 0 && p.box < MASTERED; })
      : items.filter(i => state.cats.includes(i.cat));
    round = pick(pool, state.len).map(it => ({ it, dir: state.dir === "mix" ? (Math.random() < .5 ? "de" : "nl") : state.dir }));
    idx = 0; correct = 0; mistakes = [];
    show("quiz"); ask();
  }

  function distractors(it, dir) {
    const field = dir === "de" ? "nl" : "de";
    const isSentence = s => /\s/.test(s.trim()) && s.split(" ").length > 2;
    const sameType = c => isSentence(c.de) === isSentence(it.de);
    const ok = c => c.id !== it.id && !overlaps(c.nl, it.nl) && c[field] !== it[field] && !overlaps(c.de, it.de);
    let cands = shuffle(items.filter(c => ok(c) && c.cat === it.cat && sameType(c)));
    if (cands.length < 3) cands = cands.concat(shuffle(items.filter(c => ok(c) && c.cat !== it.cat && sameType(c))));
    if (cands.length < 3) cands = cands.concat(shuffle(items.filter(c => ok(c) && !cands.includes(c))));
    const out = [];
    for (const c of cands) { if (out.length === 3) break; if (!out.some(o => o[field] === c[field] || overlaps(o.nl, c.nl))) out.push(c); }
    return out;
  }

  function ask() {
    answered = false;
    const { it, dir } = round[idx]; current = round[idx];
    const field = dir === "de" ? "nl" : "de";
    $("progBar").style.width = (idx / round.length * 100) + "%";
    $("progTxt").textContent = `${idx + 1}/${round.length}`;
    $("qCat").textContent = CATEGORIES[it.cat].icon + " " + CATEGORIES[it.cat].name;
    const prompt = dir === "de" ? it.de : it.nl;
    $("qWord").innerHTML = dir === "de" ? colorArticle(prompt) : esc(prompt);
    $("qWord").classList.toggle("long", prompt.length > 22);
    $("qHint").textContent = dir === "de" ? "Wat betekent dit?" : "Hoe zeg je dit in het Duits?";
    $("speakBtn").classList.toggle("hidden", dir !== "de" || !("speechSynthesis" in window));
    const options = shuffle([it, ...distractors(it, dir)]);
    const optsEl = $("opts"); optsEl.innerHTML = "";
    options.forEach(o => {
      const b = document.createElement("button");
      b.className = "opt";
      b.innerHTML = field === "de" ? colorArticle(o.de) : esc(o.nl);
      b.onclick = () => answer(b, o, it, options);
      b.dataset.id = o.id;
      optsEl.appendChild(b);
    });
    $("fb").className = "fb"; $("nextBtn").classList.remove("show");
  }

  function answer(btn, chosen, it, options) {
    if (answered) return; answered = true;
    const good = chosen.id === it.id;
    const p = state.progress[it.id] || { box: -1, right: 0, wrong: 0 };
    if (good) { p.right++; p.box = Math.min(5, Math.max(0, p.box) + 1); correct++; }
    else { p.wrong++; p.box = 0; mistakes.push(it); if (navigator.vibrate) navigator.vibrate(80); }
    state.progress[it.id] = p;
    if (!state.days.includes(today())) state.days.push(today());
    state.days = state.days.slice(-400);
    save();

    document.querySelectorAll(".opt").forEach(b => {
      if (b.dataset.id === it.id) b.classList.add("good");
      else if (b === btn) b.classList.add("bad");
      else b.classList.add("dim");
    });
    const fb = $("fb");
    fb.className = "fb show " + (good ? "good" : "bad");
    fb.innerHTML = `<b>${good ? "Richtig! 🎉" : "Leider falsch"}</b><br>${colorArticle(it.de)} = ${esc(it.nl)}`
      + (it.tip ? `<div class="tip">💡 ${esc(it.tip)}</div>` : "");
    $("nextBtn").classList.add("show");
    $("nextBtn").textContent = idx === round.length - 1 ? "Bekijk resultaat" : "Volgende";
    if (good) speak(it.de);
  }

  $("nextBtn").onclick = () => { idx++; idx < round.length ? ask() : finish(); };
  $("quitBtn").onclick = () => { renderHome(); show("home"); };
  $("speakBtn").onclick = () => speak(current.it.de);

  function speak(text) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "de-DE"; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith("de"));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }

  function finish() {
    $("progBar").style.width = "100%";
    const pct = correct / round.length;
    $("rScore").textContent = `${correct} / ${round.length}`;
    $("rEmoji").textContent = pct === 1 ? "🏆" : pct >= .8 ? "🎉" : pct >= .5 ? "💪" : "📚";
    $("rText").textContent = pct === 1 ? "Perfekt! Alles goed." : pct >= .8 ? "Sehr gut!" : pct >= .5 ? "Gut gemacht — blijf oefenen!" : "Nicht schlecht — herhaling helpt!";
    const ul = $("rMist"); ul.innerHTML = "";
    const uniq = [...new Map(mistakes.map(m => [m.id, m])).values()];
    uniq.forEach(m => { const li = document.createElement("li"); li.innerHTML = `<div class="de">${colorArticle(m.de)}</div><div class="nl">${esc(m.nl)}</div>`; ul.appendChild(li); });
    $("rMistCard").classList.toggle("hidden", !uniq.length);
    show("result");
  }

  $("againBtn").onclick = () => start(false);
  $("homeBtn").onclick = () => { renderHome(); show("home"); };
  $("startBtn").onclick = () => start(false);
  $("weakBtn").onclick = () => start(true);

  renderHome();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
